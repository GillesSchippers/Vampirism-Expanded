plugins:
    - prettier-plugin-java
overrides:
    - files:
          - "*.java"
      options:
          printWidth: 200
          objectWrap: "collapse"
    - files:
          - "*.json"
          - "*.mcmeta"
      options:
          printWidth: 4
    - files:
          - "*.md"
          - "*.toml"
      options:
          printWidth: 180
printWidth: 160
tabWidth: 4
useTabs: false
singleQuote: false
requirePragma: false
bracketSpacing: true
trailingComma: "none"
objectWrap: "preserve"
embeddedLanguageFormatting: "auto"
endOfLine: "lf"
